<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Fase Finale — Display</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --w:1920px; --h:1080px;
  --green:#00e676; --green-dim:#00a152; --green-dark:#003d18;
  --gold:#ffd600; --gold-dim:#c9a800;
  --silver:#cfd8dc; --bronze:#ff8a65;
  --bg:#040c06; --surface:rgba(255,255,255,.06); --surface2:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.12); --border-g:rgba(0,230,118,.35);
  --text:#ffffff; --text-dim:rgba(255,255,255,.55);
  --red:#ff5252; --font:'Barlow Condensed',sans-serif;
}

html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);}

/* ── FIELD BG ── */
.field-bg{position:fixed;inset:0;
  background:radial-gradient(ellipse 120% 80% at 50% 110%,rgba(0,80,30,.6) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% -10%,rgba(0,180,70,.08) 0%,transparent 50%),
    repeating-linear-gradient(0deg,transparent 0px,transparent 67px,rgba(0,150,50,.04) 67px,rgba(0,150,50,.04) 68px);
  z-index:0;}
.field-bg::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle 280px at 50% 85%,rgba(0,200,83,.06) 0%,transparent 70%),
    linear-gradient(90deg,transparent 48%,rgba(0,200,83,.04) 49%,rgba(0,200,83,.04) 51%,transparent 52%);}
.scanlines{position:fixed;inset:0;z-index:999;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);}

/* ── HEADER ── */
header{
  position:relative;z-index:1;
  display:grid;grid-template-columns:420px 1fr 420px;align-items:center;
  padding:0 48px;height:108px;
  background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.3) 100%);
  border-bottom:1px solid var(--border-g);}
header::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),var(--gold),var(--green),transparent);opacity:.6;}

.hdr-left{display:flex;align-items:center;gap:14px;}
.trophy-icon{font-size:2.4rem;animation:trophyPulse 3s ease-in-out infinite;}
@keyframes trophyPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(255,214,0,.4));}50%{filter:drop-shadow(0 0 20px rgba(255,214,0,.8));}}
.t-name{font-size:2.6rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;line-height:1;}
.t-sub{font-size:1.1rem;font-weight:400;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;}
.hdr-center{text-align:center;}
.phase-big{font-size:3.8rem;font-weight:900;letter-spacing:.15em;line-height:1;color:#fff;text-shadow:0 0 40px rgba(255,214,0,.5);}
.phase-sub{font-size:1rem;color:var(--text-dim);letter-spacing:.3em;text-transform:uppercase;margin-top:4px;}
.hdr-right{text-align:right;}
.clock{font-size:3.6rem;font-weight:800;letter-spacing:.05em;color:#fff;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(0,230,118,.3);}
.date-display{font-size:1.05rem;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;}

/* ── BODY ── */
.body{
  position:relative;z-index:1;
  width:var(--w);height:calc(var(--h) - 108px - 200px);
  display:grid;grid-template-columns:1fr 420px;gap:0;
  padding:24px 48px 20px;}

/* ── BRACKET ── */
.bracket-area{display:flex;flex-direction:column;gap:12px;padding-right:28px;overflow:hidden;}
.bracket-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1;}
.bracket-col{display:flex;flex-direction:column;gap:10px;}
.col-header{font-size:1rem;font-weight:700;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;
  padding:6px 14px;background:rgba(255,214,0,.07);border:1px solid rgba(255,214,0,.2);border-radius:6px;
  text-align:center;margin-bottom:6px;}
.col-header.green{color:var(--green);background:rgba(0,230,118,.06);border-color:rgba(0,230,118,.25);}

/* Match box in bracket */
.ko-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;flex:1;min-height:0;}
.ko-box.played{border-color:rgba(0,230,118,.3);}
.ko-box.final{border-color:rgba(255,214,0,.4);background:rgba(255,214,0,.04);}
.ko-box-label{font-size:.65rem;font-weight:700;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase;
  padding:5px 12px;background:rgba(0,0,0,.4);border-bottom:1px solid var(--border);}
.ko-team-row{display:grid;grid-template-columns:1fr 56px;align-items:center;padding:8px 12px;gap:8px;min-height:52px;border-bottom:1px solid rgba(255,255,255,.04);}
.ko-team-row:last-child{border-bottom:none;}
.ko-team-row.winner .ko-team-name{color:var(--green);font-weight:900;}
.ko-team-row.winner .ko-score{color:var(--green);text-shadow:0 0 12px rgba(0,230,118,.7);}
.ko-team-name{font-size:1.4rem;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ko-score{font-size:2rem;font-weight:900;text-align:right;letter-spacing:.05em;color:rgba(255,255,255,.9);}
.ko-score.pending{font-size:1rem;color:var(--text-dim);font-weight:400;}
.ko-scorers{padding:4px 12px 6px;display:flex;flex-wrap:wrap;gap:4px;}
.ko-scorer-chip{font-size:.72rem;color:rgba(0,230,118,.75);background:rgba(0,230,118,.07);border-radius:10px;padding:2px 8px;white-space:nowrap;}

/* ── RIGHT PANEL — TOP SCORERS ── */
.scorers-panel{border-left:1px solid var(--border);padding-left:28px;display:flex;flex-direction:column;gap:12px;}
.panel-title{font-size:1rem;font-weight:700;letter-spacing:.35em;color:var(--green);text-transform:uppercase;
  margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.panel-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border-g),transparent);}

.scorer-podium{display:flex;flex-direction:column;gap:8px;}
.scorer-row{display:grid;grid-template-columns:48px 1fr 56px;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;}
.scorer-row.pos-1{border-color:rgba(255,214,0,.4);background:rgba(255,214,0,.05);}
.scorer-row.pos-2{border-color:rgba(207,216,220,.3);}
.scorer-row.pos-3{border-color:rgba(255,138,101,.3);}
.scorer-medal{font-size:2rem;text-align:center;line-height:1;}
.scorer-info{}
.scorer-name{font-size:1.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1.1;}
.scorer-team{font-size:.95rem;color:var(--text-dim);letter-spacing:.08em;margin-top:2px;text-transform:uppercase;}
.scorer-goals{font-size:2.8rem;font-weight:900;text-align:right;letter-spacing:.04em;}
.pos-1 .scorer-goals{color:var(--gold);text-shadow:0 0 24px rgba(255,214,0,.7);}
.pos-2 .scorer-goals{color:var(--silver);}
.pos-3 .scorer-goals{color:var(--bronze);}
.scorer-goals-label{font-size:.75rem;color:var(--text-dim);text-align:right;letter-spacing:.1em;}

.no-scorers{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:12px;color:var(--text-dim);}
.no-scorers .icon{font-size:3rem;opacity:.3;}

/* ── FOOTER ── */
footer{position:relative;z-index:1;height:200px;
  border-top:2px solid var(--border-g);
  background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,20,8,.95) 100%);overflow:hidden;}
footer::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),var(--gold),var(--green),transparent);opacity:.7;}
.sponsor-header{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 48px 6px;flex-shrink:0;}
.sponsor-header-label{font-size:.75rem;font-weight:700;letter-spacing:.4em;color:var(--gold-dim);text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.sponsor-header-label::before,.sponsor-header-label::after{content:'';display:block;width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim));}
.sponsor-header-label::after{background:linear-gradient(90deg,var(--gold-dim),transparent);}
.sponsor-track{flex:1;overflow:hidden;display:flex;align-items:center;padding:0 48px;height:150px;}
.sponsor-inner{display:flex;align-items:center;gap:48px;white-space:nowrap;animation:sponsorScroll 55s linear infinite;will-change:transform;}
@keyframes sponsorScroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.sponsor-logo{display:flex;align-items:center;justify-content:center;height:130px;min-width:260px;padding:0 28px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);flex-shrink:0;}
.sponsor-logo img{max-height:110px;max-width:230px;object-fit:contain;filter:brightness(1.1) contrast(1.05);}
.sponsor-divider{color:var(--gold);font-size:1.4rem;opacity:.4;flex-shrink:0;}

/* content-fade */
.content-fade{transition:opacity .6s ease,transform .6s ease;}
.content-fade.hiding{opacity:0;transform:translateY(10px);}
</style>
</head>
<body>
<div class="field-bg"></div>
<div class="scanlines"></div>

<!-- HEADER -->
<header>
  <div class="hdr-left">
    <div class="trophy-icon">🏆</div>
    <div>
      <div class="t-name" id="tournament-name">TORNEO CALCIO</div>
      <div class="t-sub">Fase ad Eliminazione Diretta</div>
    </div>
  </div>
  <div class="hdr-center">
    <div class="phase-sub">TABELLONE</div>
    <div class="phase-big">FINAL EIGHT</div>
  </div>
  <div class="hdr-right">
    <div class="clock" id="clock">00:00</div>
    <div class="date-display" id="date-display">—</div>
  </div>
</header>

<!-- MAIN BODY -->
<div class="body content-fade" id="main-body">

  <!-- BRACKET -->
  <div class="bracket-area">
    <div class="bracket-grid">
      <!-- PLAY-OFF -->
      <div class="bracket-col" id="col-playoff">
        <div class="col-header">⚡ Play-off</div>
      </div>
      <!-- QUARTI -->
      <div class="bracket-col" id="col-quarti">
        <div class="col-header">🎯 Quarti di Finale</div>
      </div>
      <!-- SEMI -->
      <div class="bracket-col" id="col-semi">
        <div class="col-header green">🔥 Semifinali</div>
      </div>
      <!-- FINALI -->
      <div class="bracket-col" id="col-finali">
        <div class="col-header" style="color:#fff;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2)">🏆 Finali</div>
      </div>
    </div>
  </div>

  <!-- TOP SCORERS -->
  <div class="scorers-panel">
    <div class="panel-title">⚽ Capocannonieri</div>
    <div class="scorer-podium" id="scorer-podium">
      <div class="no-scorers"><div class="icon">⚽</div><p>Nessun marcatore</p></div>
    </div>
  </div>

</div>

<!-- FOOTER SPONSOR -->
<footer>
  <div class="sponsor-header">
    <div class="sponsor-header-label">✦ Sponsors &amp; Partner ✦</div>
  </div>
  <div class="sponsor-track">
    <div class="sponsor-inner" id="sponsor-inner">
      <!-- sponsors populated by JS or add manually like display.html -->
    </div>
  </div>
</footer>

<script>
// ════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════
const CONFIG = {
  tournamentName: 'Memorial Massimo Salvi 2026',
  dataRefreshInterval: 30000,
  // Set this to the same URL as display.html (the JSON that admin exports)
  dataUrl: 'https://raw.githubusercontent.com/alfamark78/torneo/main/finale-data.json'
};

let state = { teams:{}, matches:{}, finale:{} };

// ════════════════════════════════════════════
//  LOAD DATA
// ════════════════════════════════════════════
async function loadData(){
  try{
    if(CONFIG.dataUrl){
      const res = await fetch(CONFIG.dataUrl+'?t='+Date.now());
      state = await res.json();
    } else {
      const saved = localStorage.getItem('torneo_calcio_v2');
      if(saved) state = JSON.parse(saved);
    }
    if(!state.finale) state.finale={};
    if(state.tournamentName){
      CONFIG.tournamentName = state.tournamentName;
      document.getElementById('tournament-name').textContent = state.tournamentName;
    }
  }catch(e){ console.warn('Data load error',e); }
}

// ════════════════════════════════════════════
//  RENDER BRACKET
// ════════════════════════════════════════════
const KO_ROUNDS = [
  {key:'playoff', colId:'col-playoff'},
  {key:'quarti',  colId:'col-quarti'},
  {key:'semi',    colId:'col-semi'},
  {key:'finali',  colId:'col-finali'},
];

function renderBracket(){
  KO_ROUNDS.forEach(r=>{
    const col = document.getElementById(r.colId);
    // keep header
    const header = col.querySelector('.col-header');
    col.innerHTML='';
    col.appendChild(header);
    const matches = (state.finale[r.key]||[]);
    if(!matches.length){
      const empty=document.createElement('div');
      empty.style.cssText='flex:1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2);font-size:1.2rem;letter-spacing:.1em;';
      empty.textContent='Da definire';
      col.appendChild(empty);
      return;
    }
    matches.forEach(m=>col.appendChild(buildKOBox(m)));
  });
}

function buildKOBox(m){
  const isPlayed = m.played && m.homeGoals!==null && m.awayGoals!==null;
  const isFinal = m.label&&(m.label.includes('FINALE')||m.label.includes('Finale'));

  let homeWin=false, awayWin=false;
  if(isPlayed){
    homeWin = m.homeGoals > m.awayGoals;
    awayWin = m.awayGoals > m.homeGoals;
  }

  const el = document.createElement('div');
  el.className = 'ko-box'+(isPlayed?' played':'')+(isFinal?' final':'');
  el.style.cssText='display:flex;flex-direction:column;';

  // label bar
  const lbl = document.createElement('div');
  lbl.className='ko-box-label';
  lbl.textContent = m.label||'';
  el.appendChild(lbl);

  // home team
  const homeRow = buildTeamRow(m.home||'—', isPlayed?m.homeGoals:null, homeWin);
  el.appendChild(homeRow);

  // away team
  const awayRow = buildTeamRow(m.away||'—', isPlayed?m.awayGoals:null, awayWin);
  el.appendChild(awayRow);

  // scorers
  if(isPlayed && m.scorers && m.scorers.length){
    const sc = document.createElement('div');
    sc.className='ko-scorers';
    m.scorers.forEach(s=>{
      const chip=document.createElement('span');
      chip.className='ko-scorer-chip';
      chip.textContent=`⚽ ${s.name} (${s.team})`;
      sc.appendChild(chip);
    });
    el.appendChild(sc);
  }

  return el;
}

function buildTeamRow(name, score, isWinner){
  const row=document.createElement('div');
  row.className='ko-team-row'+(isWinner?' winner':'');

  const nameEl=document.createElement('div');
  nameEl.className='ko-team-name';
  nameEl.textContent=name;

  const scoreEl=document.createElement('div');
  if(score!==null){
    scoreEl.className='ko-score';
    scoreEl.textContent=score;
  } else {
    scoreEl.className='ko-score pending';
    scoreEl.textContent='—';
  }

  row.appendChild(nameEl);
  row.appendChild(scoreEl);
  return row;
}

// ════════════════════════════════════════════
//  RENDER TOP SCORERS
// ════════════════════════════════════════════
function computeTopScorers(){
  const map={};
  const rounds=['playoff','quarti','semi','finali'];
  rounds.forEach(k=>(state.finale[k]||[]).forEach(m=>(m.scorers||[]).forEach(s=>{
    const key=s.name+'||'+s.team;
    if(!map[key]) map[key]={name:s.name,team:s.team,goals:0};
    map[key].goals++;
  })));
  return Object.values(map).sort((a,b)=>b.goals-a.goals);
}

function renderTopScorers(){
  const scorers = computeTopScorers().slice(0,3);
  const el = document.getElementById('scorer-podium');
  if(!scorers.length){
    el.innerHTML='<div class="no-scorers"><div class="icon">⚽</div><p style="font-size:1.1rem;letter-spacing:.1em">Nessun marcatore ancora</p></div>';
    return;
  }
  const medals=['🥇','🥈','🥉'];
  const classes=['pos-1','pos-2','pos-3'];
  el.innerHTML=scorers.map((s,i)=>`
    <div class="scorer-row ${classes[i]||''}">
      <div class="scorer-medal">${medals[i]}</div>
      <div class="scorer-info">
        <div class="scorer-name">${s.name}</div>
        <div class="scorer-team">${s.team}</div>
      </div>
      <div>
        <div class="scorer-goals">${s.goals}</div>
        <div class="scorer-goals-label">GOL</div>
      </div>
    </div>`).join('');
}

// ════════════════════════════════════════════
//  SPONSORS — copy same set as display.html
// ════════════════════════════════════════════
function buildSponsors(){
  const inner = document.getElementById('sponsor-inner');
  const base = 'https://raw.githubusercontent.com/alfamark78/torneo/main/sponsor/';
  const count = 49;
  let html='';
  for(let i=1;i<=count;i++){
    html+=`<div class="sponsor-logo"><img src="${base}${i}.jpg" alt="Sponsor ${i}" onerror="this.parentElement.style.display='none'"></div>`;
    if(i<count) html+=`<div class="sponsor-divider">◆</div>`;
  }
  // duplicate for seamless scroll
  inner.innerHTML=html+html;
}

// ════════════════════════════════════════════
//  CLOCK
// ════════════════════════════════════════════
function updateClock(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const days=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const months=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  document.getElementById('date-display').textContent=`${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
async function init(){
  await loadData();
  document.getElementById('tournament-name').textContent=CONFIG.tournamentName;
  buildSponsors();
  renderBracket();
  renderTopScorers();
  updateClock();
  setInterval(updateClock,1000);
  setInterval(async()=>{
    await loadData();
    renderBracket();
    renderTopScorers();
  }, CONFIG.dataRefreshInterval);
}

init();
</script>
</body>
</html>
