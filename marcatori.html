<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Classifica Marcatori</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --w: 590px; --h: 490px;
  --green: #00e676; --green-dim: #00a152;
  --gold: #ffd600; --silver: #cfd8dc; --bronze: #ff8a65;
  --bg: #040c06; --surface: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.12); --border-g: rgba(0,230,118,0.35);
  --text: #ffffff; --text-dim: rgba(255,255,255,0.55);
  --font: 'Barlow Condensed', sans-serif;
}

html, body { 
  width: var(--w); height: var(--h); 
  overflow: hidden; background: var(--bg); 
  font-family: var(--font); color: var(--text); 
}

/* SFONDO STILE CAMPO DA GIOCO COMPATTO */
.field-bg {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 100% 80% at 50% 110%, rgba(0,80,30,0.5) 0%, transparent 70%),
    radial-gradient(circle 180px at 50% -10%, rgba(0,180,70,0.06) 0%, transparent 60%);
  z-index: 0;
}
.scanlines { 
  position:fixed; inset:0; z-index:999; pointer-events:none; 
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px); 
}

/* CONTENITORE PRINCIPALE (RIQUADRO MARCATORI ADATTATO) */
.scorer-panel {
  position: relative; z-index: 1;
  width: var(--w); height: var(--h);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(0,230,118,0.02) 0%, rgba(0,0,0,0.4) 100%);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 16px;
  overflow: hidden;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.5);
}

/* ETICHETTA TITOLO */
.panel-label {
  font-size: 1.35rem; font-weight: 900; letter-spacing: 0.18em; color: var(--gold); text-transform: uppercase;
  margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  padding: 8px 14px; border-radius: 8px;
  background: linear-gradient(90deg, rgba(255,214,0,0.12), transparent);
  border-left: 3px solid var(--gold);
  text-shadow: 0 0 14px rgba(255,214,0,0.5);
}
.panel-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, rgba(255,214,0,0.3), transparent); }

/* AREA CAPOCANNONIERE FISSO */
#scorer-top-fixed {
  flex-shrink: 0;
  margin-bottom: 10px;
}

/* AREA SCORREVOLE ALTRI MARCATORI */
.scorer-scroll-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  border-top: 1px dashed rgba(255,255,255,0.15);
  padding-top: 10px;
}

.scorer-marquee-track {
  display: flex; flex-direction: column; gap: 8px;
  position: absolute; width: 100%; top: 0;
  animation: verticalScroll 25s linear infinite;
}

@keyframes verticalScroll {
  0% { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}

/* STRUTTURA RIGHE DELLA CLASSIFICA */
.scorer-row {
  display: grid; grid-template-columns: 42px 1fr 65px; align-items: center;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px;
}
.scorer-row.top1 { 
  background: linear-gradient(90deg, rgba(255,214,0,0.14), rgba(255,214,0,0.02)); 
  border-color: rgba(255,214,0,0.4); box-shadow: 0 0 12px rgba(255,214,0,0.1); 
}
.scorer-row.top2 { background: linear-gradient(90deg, rgba(207,216,220,0.08), rgba(207,216,220,0.01)); border-color: rgba(207,216,220,0.2); }
.scorer-row.top3 { background: linear-gradient(90deg, rgba(255,138,101,0.08), rgba(255,138,101,0.01)); border-color: rgba(255,138,101,0.2); }

.scorer-rank { font-size: 1.6rem; font-weight: 900; text-align: center; line-height: 1; }
.scorer-rank.r1 { color: var(--gold); text-shadow: 0 0 10px rgba(255,214,0,0.6); font-size: 1.8rem; }
.scorer-rank.r2 { color: var(--silver); }
.scorer-rank.r3 { color: var(--bronze); }
.scorer-rank.rn { color: var(--text-dim); }

.scorer-info { padding: 0 10px; overflow: hidden; }
.scorer-name { font-size: 1.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.scorer-team { font-size: 0.85rem; font-weight: 400; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 1px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }

.scorer-goals { text-align: center; }
.scorer-goals-num { font-size: 2.3rem; font-weight: 900; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.scorer-row.top1 .scorer-goals-num { color: var(--gold); text-shadow: 0 0 8px rgba(255,214,0,0.4); }
.scorer-goals-lbl { font-size: 0.65rem; font-weight: 600; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }

.no-matches { color: var(--text-dim); font-size: 1.2rem; letter-spacing: 0.08em; padding: 20px; font-weight: 300; text-align: center; width: 100%; }
</style>
</head>
<body>

<div class="field-bg"></div>
<div class="scanlines"></div>

<div class="scorer-panel">
  <div class="panel-label">&#x1F45F; Classifica Marcatori</div>
  
  <!-- Primo Posto Fisso -->
  <div id="scorer-top-fixed"></div>
  
  <!-- Altri posti in Scorrimento Continuo -->
  <div class="scorer-scroll-container" id="scorer-scroll-container">
    <div class="scorer-marquee-track" id="scorer-marquee-track"></div>
  </div>
</div>

<script>
const CONFIG = {
  dataUrl: 'https://raw.githubusercontent.com/alfamark78/torneo/main/torneo-data.json',
  dataRefreshInterval: 30000 // Aggiorna i dati dal JSON ogni 30 secondi
};

let state = { matches: {}, knockout: { playoff:[], quarti:[], semifinali:[], finali:[] } };

async function loadData(){
  try {
    const res = await fetch(CONFIG.dataUrl + '?t=' + Date.now());
    state = await res.json();
  } catch(e){ console.warn('Errore caricamento JSON:', e); }
}

function buildScorers(){
  const map = {};
  function addGoals(list){
    (list||[]).forEach(m=>{
      (m.scorers||[]).forEach(s=>{
        const name  = (s.name||s.player||'').trim().toUpperCase();
        const team  = (s.team||'').trim().toUpperCase();
        const goals = parseInt(s.goals||s.count||s.gol||1,10)||1;
        if(!name) return;
        const key = name+'|'+team;
        if(!map[key]) map[key]={name,team,goals:0};
        map[key].goals += goals;
      });
    });
  }
  
  // Scansiona sia i gironi che la fase finale
  Object.values(state.matches||{}).forEach(g=>addGoals(g));
  const ko = state.knockout||{};
  ['playoff','quarti','semifinali','finali'].forEach(p=>addGoals(ko[p]));
  
  return Object.values(map).filter(s=>s.goals>0).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));
}

const RANK_CLS = ['r1','r2','r3'];
const ROW_CLS  = ['top1','top2','top3'];

function generateRowHtml(s, i) {
  return '<div class="scorer-row '+(ROW_CLS[i]||'')+'">'+
    '<div class="scorer-rank '+(RANK_CLS[i]||'rn')+'">'+(i===0 ? '👑' : (i+1))+'</div>'+
    '<div class="scorer-info">'+
      '<div class="scorer-name">'+s.name+'</div>'+
      '<div class="scorer-team">'+s.team+'</div>'+
    '</div>'+
    '<div class="scorer-goals">'+
      '<div class="scorer-goals-num">'+s.goals+'</div>'+
      '<div class="scorer-goals-lbl">GOL</div>'+
    '</div>'+
  '</div>';
}

function renderScorers(){
  const topFixedEl = document.getElementById('scorer-top-fixed');
  const trackEl = document.getElementById('scorer-marquee-track');
  const scrollContainer = document.getElementById('scorer-scroll-container');
  
  const sc = buildScorers();
  
  if(!sc.length){ 
    topFixedEl.innerHTML = '<div class="no-matches">Nessun marcatore registrato</div>'; 
    trackEl.innerHTML = '';
    scrollContainer.style.display = 'none';
    return; 
  }
  
  // 1. Tutti i capocannonieri a pari merito bloccati in alto
  const topGoals = sc[0].goals;
  const topScorers = sc.filter(s => s.goals === topGoals);
  topFixedEl.innerHTML = topScorers.map(s => generateRowHtml(s, 0)).join('');
  
  // 2. Altri Marcatori nel Marquee Continuo (dopo i capocannonieri)
  const restScorers = sc.slice(topScorers.length);
  if (restScorers.length === 0) {
    scrollContainer.style.display = 'none';
    trackEl.innerHTML = '';
  } else {
    scrollContainer.style.display = 'block';
    const itemsHtml = restScorers.map((s, i) => generateRowHtml(s, i + topScorers.length)).join('');
    
    // Duplica la lista per l'effetto di scorrimento infinito fluido
    trackEl.innerHTML = itemsHtml + itemsHtml;
    
    // Adatta la velocità in base al numero di elementi
    const duration = Math.max(10, restScorers.length * 4); 
    trackEl.style.animationDuration = duration + 's';
  }
}

async function init(){
  await loadData();
  renderScorers();
  // Aggiornamento live in background
  setInterval(async()=>{ await loadData(); renderScorers(); }, CONFIG.dataRefreshInterval);
}

init();
</script>
</body>
</html>
