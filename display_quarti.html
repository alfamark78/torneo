<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Memorial Massimo Salvi — Fase Finale</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@300;400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --w: 1920px; --h: 1080px;
  --green: #00e676; --green-dim: #00a152; --green-dark: #003d18;
  --gold: #ffd600; --gold-dim: #c9a800;
  --silver: #cfd8dc; --bronze: #ff8a65;
  --bg: #040c06; --surface: rgba(255,255,255,0.06); --surface2: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.12); --border-g: rgba(0,230,118,0.35);
  --text: #ffffff; --text-dim: rgba(255,255,255,0.55);
  --red: #ff5252; --font: 'Barlow Condensed', sans-serif;
}

html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--text); }

.field-bg {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 120% 80% at 50% 110%, rgba(0,80,30,0.6) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% -10%, rgba(0,180,70,0.08) 0%, transparent 50%),
    repeating-linear-gradient(0deg, transparent 0px, transparent 67px, rgba(0,150,50,0.04) 67px, rgba(0,150,50,0.04) 68px);
  z-index: 0;
}
.field-bg::before {
  content:''; position:absolute; inset:0;
  background: radial-gradient(circle 280px at 50% 85%, rgba(0,200,83,0.06) 0%, transparent 70%),
    linear-gradient(90deg, transparent 48%, rgba(0,200,83,0.04) 49%, rgba(0,200,83,0.04) 51%, transparent 52%);
}
.scanlines { position:fixed;inset:0;z-index:999;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px); }

.screen {
  position:relative;z-index:1;width:var(--w);height:var(--h);
  display:grid;grid-template-rows:108px 1fr 260px;
}

/* HEADER */
header {
  display:grid;grid-template-columns:420px 1fr 360px;align-items:center;
  padding:0 48px;background:linear-gradient(180deg,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0.3) 100%);
  border-bottom:1px solid var(--border-g);position:relative;
}
header::after {
  content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),var(--gold),var(--green),transparent);opacity:0.6;
}
.header-left { display:flex;align-items:center;gap:14px; }
.trophy-icon { font-size:2.4rem;filter:drop-shadow(0 0 12px rgba(255,214,0,0.5));animation:trophyPulse 3s ease-in-out infinite; }
@keyframes trophyPulse {
  0%,100%{filter:drop-shadow(0 0 8px rgba(255,214,0,0.4));}
  50%{filter:drop-shadow(0 0 20px rgba(255,214,0,0.8));}
}
.tournament-name { font-size:2.6rem;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,0.6); }
.tournament-sub { font-size:1.1rem;font-weight:400;color:var(--gold);letter-spacing:0.2em;text-transform:uppercase; }
.header-center { text-align:center; }
.phase-label { font-size:1.3rem;font-weight:400;color:var(--text-dim);letter-spacing:0.3em;text-transform:uppercase; }
.phase-title { font-size:4rem;font-weight:900;letter-spacing:0.12em;line-height:1;color:#fff;text-shadow:0 0 40px rgba(255,214,0,0.5); transform: translateY(-2px); }
.header-right { text-align:right; }
.clock { font-size:3.6rem;font-weight:800;letter-spacing:0.05em;color:#fff;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(0,230,118,0.3); }
.date-display { font-size:1.05rem;font-weight:400;color:var(--text-dim);letter-spacing:0.15em;text-transform:uppercase; }

/* MAIN CONTENT LAYOUT */
.content {
  display: grid;
  grid-template-columns: 1fr 440px;
  gap: 32px;
  padding: 24px 48px;
  overflow: hidden;
  position: relative;
}

/* LEFT WORKSPACE FOR ROTATING PAGES */
.dynamic-area {
  position: relative;
  overflow: hidden;
}

.page-view {
  position: absolute;
  inset: 0;
  display: none;
  opacity: 0;
  transition: opacity 0.5s ease-in-out;
}

.page-view.active {
  display: grid;
  opacity: 1;
}

/* SCHERMATA 1: QUARTI IN 4 BLOCCHI (2x2) */
#page-quarti {
  grid-template-rows: auto 1fr;
}
#quarti-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 16px;
  margin-top: 10px;
  min-height: 0;
}
#page-quarti .match-card { padding: 22px 26px; }
#page-quarti .mc-name { font-size: 2.1rem; }
#page-quarti .mc-score { font-size: 3.4rem; }

/* SCHERMATA 2: SEMIFINALI */
#page-semifinali {
  grid-template-rows: auto 1fr;
}
#semi-list {
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 16px;
  margin-top: 10px;
  min-height: 0;
}
#page-semifinali .match-card { padding: 32px 40px; }
#page-semifinali .mc-name { font-size: 2.4rem; }
#page-semifinali .mc-score { font-size: 3.8rem; }

/* COLONNA FISSA DESTRA: CLASSIFICA MARCATORI CON SCROLL */
.scorer-panel {
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, rgba(0,230,118,0.02) 0%, rgba(0,0,0,0.25) 100%);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 18px;
  overflow: hidden;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.4);
}

/* Contenitore del Primo Posto Fisso */
#scorer-top-fixed {
  flex-shrink: 0;
  margin-top: 5px;
  margin-bottom: 12px;
}

/* Area di scorrimento per le altre posizioni */
.scorer-scroll-container {
  flex: 1;
  position: relative;
  overflow: hidden; /* Taglia via gli elementi fuori dal riquadro */
  border-top: 1px dashed rgba(255,255,255,0.15);
  padding-top: 12px;
}

.scorer-marquee-track {
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: absolute;
  width: 100%;
  top: 0;
  animation: verticalScroll 25s linear infinite; /* Animazione continua per scorrere i restanti */
}

/* Pausa dello scorrimento se si va sopra col mouse (opzionale, utile per test) */
.scorer-scroll-container:hover .scorer-marquee-track {
  animation-play-state: paused;
}

@keyframes verticalScroll {
  0% { transform: translateY(0); }
  100% { transform: translateY(-50%); } /* Si sposta esattamente della metà (per via del clone) */
}

/* PANEL LABEL */
.panel-label {
  font-size:1.25rem;font-weight:900;letter-spacing:0.2em;color:var(--green);text-transform:uppercase;
  margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-shrink:0;
  padding:8px 16px;border-radius:8px;
  background:linear-gradient(90deg,rgba(0,230,118,0.13),transparent);
  border-left:3px solid var(--green);
  text-shadow:0 0 18px rgba(0,230,118,0.55);
}
.panel-label.gold-label {
  color:var(--gold);background:linear-gradient(90deg,rgba(255,214,0,0.13),transparent);
  border-left:3px solid var(--gold);text-shadow:0 0 18px rgba(255,214,0,0.55);
}
.panel-label.silver-label {
  color:var(--silver);background:linear-gradient(90deg,rgba(207,216,220,0.13),transparent);
  border-left:3px solid var(--silver);text-shadow:0 0 18px rgba(207,216,220,0.4);
}
.panel-label::after { content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border-g),transparent); }
.panel-label.gold-label::after { background:linear-gradient(90deg,rgba(255,214,0,0.35),transparent); }
.panel-label.silver-label::after { background:linear-gradient(90deg,rgba(207,216,220,0.25),transparent); }

/* MATCH CARD */
.match-card {
  display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
}
.match-card.played { border-color:rgba(0,230,118,0.2); }
.match-card.played.winner-home { border-left:4px solid var(--green); }
.match-card.played.winner-away { border-right:4px solid var(--green); }

.mc-team { display:flex;flex-direction:column;gap:1px; overflow:hidden; }
.mc-team.home { text-align:right;align-items:flex-end; }
.mc-team.away { text-align:left;align-items:flex-start; }
.mc-name {
  font-weight:900;text-transform:uppercase;letter-spacing:0.02em;line-height:1.1;
  white-space:normal;word-break:break-word;
}
.mc-name.winner { color:var(--green); }
.mc-badge { font-size:0.95rem;font-weight:800;letter-spacing:0.15em;color:var(--text-dim);text-transform:uppercase;margin-top:2px; }
.mc-center { text-align:center; flex-shrink:0; }
.mc-score { font-weight:900;letter-spacing:0.04em;color:#fff;font-variant-numeric:tabular-nums;line-height:1; }
.mc-score.pending { font-size:1.8rem;font-weight:700;color:var(--text-dim);letter-spacing:0.2em; }
.mc-datetime { font-size:0.95rem;color:var(--text-dim);margin-top:4px;letter-spacing:0.05em;font-weight:600; }
.no-matches { color:var(--text-dim);font-size:1.3rem;letter-spacing:0.1em;padding:20px;font-weight:300; text-align:center; width:100%; }

/* RIGHE MARCATORI */
.scorer-row {
  display:grid;grid-template-columns:38px 1fr 58px;align-items:center;
  padding:12px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
}
.scorer-row.top1 { background:linear-gradient(90deg,rgba(255,214,0,0.15),rgba(255,214,0,0.03));border-color:rgba(255,214,0,0.4); box-shadow: 0 0 15px rgba(255,214,0,0.1); }
.scorer-row.top2 { background:linear-gradient(90deg,rgba(207,216,220,0.08),rgba(207,216,220,0.01));border-color:rgba(207,216,220,0.2); }
.scorer-row.top3 { background:linear-gradient(90deg,rgba(255,138,101,0.08),rgba(255,138,101,0.01));border-color:rgba(255,138,101,0.2); }
.scorer-rank { font-size:1.7rem;font-weight:900;text-align:center;line-height:1; }
.scorer-rank.r1 { color:var(--gold);text-shadow:0 0 12px rgba(255,214,0,0.6); font-size:1.9rem; }
.scorer-rank.r2 { color:var(--silver); }
.scorer-rank.r3 { color:var(--bronze); }
.scorer-rank.rn { color:var(--text-dim); }
.scorer-info { padding:0 8px; overflow:hidden; }
.scorer-name { font-size:1.7rem;font-weight:900;text-transform:uppercase;letter-spacing:0.02em;line-height:1.1; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
.scorer-team { font-size:0.85rem;font-weight:400;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
.scorer-goals { text-align:center; }
.scorer-goals-num { font-size:2.5rem;font-weight:900;line-height:1;color:#fff;font-variant-numeric:tabular-nums; }
.scorer-row.top1 .scorer-goals-num { color:var(--gold); text-shadow:0 0 10px rgba(255,214,0,0.4); }
.scorer-goals-lbl { font-size:0.7rem;font-weight:600;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase; }

/* FOOTER SPONSOR */
footer {
  display:flex;flex-direction:column;border-top:2px solid var(--border-g);
  background:linear-gradient(180deg,rgba(0,0,0,0.75) 0%,rgba(0,20,8,0.95) 100%);
  overflow:hidden;position:relative;
}
footer::before {
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),var(--gold),var(--green),transparent);opacity:0.7;
}
.sponsor-header { display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 48px 6px;flex-shrink:0; }
.sponsor-header-label {
  font-size:0.75rem;font-weight:700;letter-spacing:0.4em;color:var(--gold-dim);text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.sponsor-header-label::before,.sponsor-header-label::after { content:'';display:block;width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim)); }
.sponsor-header-label::after { background:linear-gradient(90deg,var(--gold-dim),transparent); }
.sponsor-track { flex:1;overflow:hidden;display:flex;align-items:center;padding:0 48px; }
.sponsor-inner { display:flex;align-items:center;gap:48px;white-space:nowrap;animation:sponsorScroll 55s linear infinite;will-change:transform; }
@keyframes sponsorScroll { 0%{transform:translateX(0);}100%{transform:translateX(-50%);} }
.sponsor-logo { display:flex;align-items:center;justify-content:center;height:150px;min-width:280px;padding:0 32px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);flex-shrink:0; }
.sponsor-logo img { max-height:128px;max-width:260px;object-fit:contain;filter:brightness(1.1) contrast(1.05); }
.sponsor-divider { color:var(--gold);font-size:1.4rem;opacity:0.4;flex-shrink:0; }
</style>
</head>

<script>
const CONFIG = {
  tournamentName: 'Memorial Massimo Salvi 2026',
  dataUrl: 'https://raw.githubusercontent.com/alfamark78/torneo/main/torneo-data.json',
  dataRefreshInterval: 30000
};

let state = { knockout: { playoff:[], quarti:[], semifinali:[], finali:[] } };
let currentView = 'quarti';

async function loadData(){
  try {
    const res = await fetch(CONFIG.dataUrl + '?t=' + Date.now());
    state = await res.json();
    if(!state.knockout) state.knockout = {playoff:[],quarti:[],semifinali:[],finali:[]};
    ['playoff','quarti','semifinali','finali'].forEach(p=>{ if(!state.knockout[p]) state.knockout[p]=[]; });
    if(state.tournamentName){
      CONFIG.tournamentName = state.tournamentName;
      document.getElementById('tournament-name').textContent = state.tournamentName;
    }
  } catch(e){ console.warn('Errore caricamento dati:', e); }
}

function formatDate(d){
  if(!d) return '';
  const p = d.split('-');
  return p[2]+'/'+p[1];
}

function matchWinner(m){
  if(!m.played || m.homeGoals===null) return null;
  if(m.homeGoals > m.awayGoals) return 'home';
  if(m.awayGoals > m.homeGoals) return 'away';
  return 'draw';
}

function renderMatchCard(m, label){
  const w = matchWinner(m);
  const homeWin = w==='home', awayWin = w==='away';
  const dt = (m.time ? m.time+' · ' : '') + (m.date ? formatDate(m.date) : '');
  return '<div class="match-card'+(m.played?' played':'')+(homeWin?' winner-home':'')+(awayWin?' winner-away':'')+'">'+
    '<div class="mc-team home">'+
      '<div class="mc-name'+(homeWin?' winner':'')+'">'+( m.home||'&mdash;')+'</div>'+
      (label ? '<div class="mc-badge">'+label+'</div>' : '')+
    '</div>'+
    '<div class="mc-center">'+
      (m.played ? '<div class="mc-score">'+m.homeGoals+' &ndash; '+m.awayGoals+'</div>' : '<div class="mc-score pending">VS</div>')+
      (dt ? '<div class="mc-datetime">'+dt+'</div>' : '')+
    '</div>'+
    '<div class="mc-team away">'+
      '<div class="mc-name'+(awayWin?' winner':'')+'">'+( m.away||'&mdash;')+'</div>'+
    '</div>'+
  '</div>';
}

function buildScorers(){
  const map = {};
  function addGoals(list){
    (list||[]).forEach(m=>{
      (m.scorers||[]).forEach(s=>{
        const name  = (s.name||s.player||'').trim().toUpperCase();
        const team  = (s.team||'').trim().toUpperCase();
        const goals = parseInt(s.goals||s.count||s.gol||1,10)||1;
        if(!name) return;
        const key = name+'|'+team;
        if(!map[key]) map[key]={name,team,goals:0};
        map[key].goals += goals;
      });
    });
  }
  Object.values(state.matches||{}).forEach(g=>addGoals(g));
  const ko = state.knockout||{};
  ['playoff','quarti','semifinali','finali'].forEach(p=>addGoals(ko[p]));
  return Object.values(map).filter(s=>s.goals>0).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));
}

const RANK_CLS = ['r1','r2','r3'];
const ROW_CLS  = ['top1','top2','top3'];

function generateScorerRowHtml(s, i) {
  return '<div class="scorer-row '+(ROW_CLS[i]||'')+'">'+
    '<div class="scorer-rank '+(RANK_CLS[i]||'rn')+'">'+(i===0 ? '👑' : (i+1))+'</div>'+
    '<div class="scorer-info">'+
      '<div class="scorer-name">'+s.name+'</div>'+
      '<div class="scorer-team">'+s.team+'</div>'+
    '</div>'+
    '<div class="scorer-goals">'+
      '<div class="scorer-goals-num">'+s.goals+'</div>'+
      '<div class="scorer-goals-lbl">GOL</div>'+
    '</div>'+
  '</div>';
}

function renderScorers(){
  const topFixedEl = document.getElementById('scorer-top-fixed');
  const trackEl = document.getElementById('scorer-marquee-track');
  const scrollContainer = document.getElementById('scorer-scroll-container');
  
  const sc = buildScorers();
  
  if(!sc.length){ 
    topFixedEl.innerHTML='<div class="no-matches">Nessun marcatore registrato</div>'; 
    trackEl.innerHTML='';
    scrollContainer.style.display = 'none';
    return; 
  }
  
  // 1. Trova tutti i capocannonieri a pari merito (stesso numero di gol del primo)
  const topGoals = sc[0].goals;
  const topScorers = sc.filter(s => s.goals === topGoals);
  
  // Tutti i capocannonieri a pari merito vengono mostrati statici in cima
  topFixedEl.innerHTML = topScorers.map(s => generateScorerRowHtml(s, 0)).join('');
  
  // 2. Gestione degli altri marcatori (dopo i capocannonieri)
  const restScorers = sc.slice(topScorers.length);
  
  if (restScorers.length === 0) {
    scrollContainer.style.display = 'none';
    trackEl.innerHTML = '';
  } else {
    scrollContainer.style.display = 'block';
    
    // Generiamo l'HTML dei restanti marcatori con indice corretto per il badge (oro/argento/bronzo)
    const itemsHtml = restScorers.map((s, i) => generateScorerRowHtml(s, i + topScorers.length)).join('');
    
    // Per creare l'effetto infinito (Marquee), cloniamo la lista dentro il binario
    trackEl.innerHTML = itemsHtml + itemsHtml;
    
    // Regoliamo la velocità dinamica dell'animazione in base a quanti elementi ci sono
    const duration = Math.max(12, restScorers.length * 3.5); 
    trackEl.style.animationDuration = duration + 's';
  }
}

function render(){
  const ko = state.knockout||{};

  // 1. Render Quarti (Griglia 2x2 a sinistra)
  const qEl = document.getElementById('quarti-list');
  const qM  = ko.quarti||[];
  if(!qM.length){ qEl.innerHTML='<div class="no-matches">Nessuna partita inserita</div>'; }
  else { qEl.innerHTML = qM.map((m,i)=>renderMatchCard(m,'Q'+(i+1))).join(''); }

  // 2. Render Semifinali (Lista verticale a sinistra)
  const sEl = document.getElementById('semi-list');
  const sM  = ko.semifinali||[];
  if(!sM.length){ sEl.innerHTML='<div class="no-matches">Nessuna partita inserita</div>'; }
  else { sEl.innerHTML = sM.map((m,i)=>renderMatchCard(m,'SF'+(i+1))).join(''); }

  // 3. Render Marcatori (Fisso + Marquee dinamico)
  renderScorers();
}

// ROTAZIONE SCHERMATE SINISTRE
function startScreenRotation() {
  const switchView = () => {
    const pageQuarti = document.getElementById('page-quarti');
    const pageSemi = document.getElementById('page-semifinali');
    const mainTitle = document.getElementById('phase-title');

    pageQuarti.style.opacity = '0';
    pageSemi.style.opacity = '0';

    setTimeout(() => {
      if (currentView === 'quarti') {
        currentView = 'semi';
        pageQuarti.classList.remove('active');
        pageSemi.classList.add('active');
        mainTitle.textContent = "SEMIFINALI";
        
        setTimeout(() => pageSemi.style.opacity = '1', 50);
        setTimeout(switchView, 10000); 
      } else {
        currentView = 'quarti';
        pageSemi.classList.remove('active');
        pageQuarti.classList.add('active');
        mainTitle.textContent = "QUARTI DI FINALE";

        setTimeout(() => pageQuarti.style.opacity = '1', 50);
        setTimeout(switchView, 15000); 
      }
    }, 500);
  };

  setTimeout(() => {
    document.getElementById('page-quarti').style.opacity = '1';
    switchView();
  }, 15000);
}

function updateClock(){
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  const days=['Domenica','Lunedi\u0300','Martedi\u0300','Mercoledi\u0300','Giovedi\u0300','Venerdi\u0300','Sabato'];
  const months=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  document.getElementById('date-display').textContent = days[now.getDay()]+' '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
}

async function init(){
  await loadData();
  document.getElementById('tournament-name').textContent = CONFIG.tournamentName;
  render();
  updateClock();
  
  document.getElementById('page-quarti').style.opacity = '1';
  
  setInterval(updateClock,1000);
  setInterval(async()=>{ await loadData(); render(); }, CONFIG.dataRefreshInterval);
  
  startScreenRotation();
}

init();
</script>
